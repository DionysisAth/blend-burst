name: Build, test & release APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  test:
    name: Analyze, unit & widget tests, level bot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Bot plays every level (invariant checks)
        run: dart run tool/level_bot.dart --plays 5

  build-apk:
    name: Build release APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --build-number ${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk blend-burst.apk
      - uses: actions/upload-artifact@v4
        with:
          name: blend-burst-apk
          path: blend-burst.apk
          if-no-files-found: error

  emulator:
    name: Emulator tests (API ${{ matrix.api-level }} ${{ matrix.target }})
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Newer emulator system images have crashed on the CI host while drawing;
    # only the configs marked required gate the release.
    continue-on-error: ${{ !matrix.required }}
    # The game plays music. With -noaudio the emulator has no audio device
    # and the guest audio HAL fails every write (pcm_writei I/O errors).
    # Keep the device and route it to QEMU's silent null backend instead.
    env:
      QEMU_AUDIO_DRV: none
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api-level: 29, target: google_apis, required: true }
          - { api-level: 30, target: aosp_atd, required: false }
          - { api-level: 33, target: google_apis, required: false }
          - { api-level: 34, target: aosp_atd, required: false }
          - { api-level: 35, target: google_apis, required: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/download-artifact@v4
        with:
          name: blend-burst-apk
      - name: Pre-build the test app before the emulator needs the RAM
        run: |
          # The template lets Gradle take 8 GB; next to a 3 GB emulator on a
          # 16 GB runner that gets the emulator OOM-killed. Cap it and stop
          # the daemons once the build is cached.
          sed -i 's/-Xmx8G -XX:MaxMetaspaceSize=4G/-Xmx3G -XX:MaxMetaspaceSize=1G/' android/gradle.properties
          flutter build apk --debug --target integration_test/app_test.dart
          (cd android && ./gradlew --stop) || true
          pkill -f KotlinCompileDaemon || true
          free -m
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Release APK smoke test + on-device integration test
        id: attempt1
        continue-on-error: true
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          ram-size: 3072M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash ci/android_smoke_test.sh blend-burst.apk smoke-results
            bash ci/integration_test.sh smoke-results
      # A crash of the app fails the job right away. Only when the emulator
      # process itself died (it does on some CI images) is it retried once.
      - name: Retry on a fresh emulator (the emulator died, not the app)
        id: attempt2
        if: steps.attempt1.outcome == 'failure' && hashFiles('smoke-results/EMULATOR_DIED') != ''
        continue-on-error: true
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          ram-size: 3072M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash ci/android_smoke_test.sh blend-burst.apk smoke-results/retry
            bash ci/integration_test.sh smoke-results/retry
      - name: Result
        run: |
          echo "attempt 1: ${{ steps.attempt1.outcome }}, attempt 2: ${{ steps.attempt2.outcome }}"
          if [ "${{ steps.attempt1.outcome }}" = "success" ] || [ "${{ steps.attempt2.outcome }}" = "success" ]; then
            echo "Passed"
          else
            echo "::error::Emulator tests failed"
            exit 1
          fi
      - name: Diagnose
        if: failure()
        run: |
          free -m
          sudo dmesg | grep -i -E "out of memory|killed process|oom" | tail -20 || true
          echo "--- last device log lines before the failure ---"
          tail -120 smoke-results/integration-logcat.txt || true
          tail -60 smoke-results/retry/integration-logcat.txt || true
          ls -la /tmp/android-runner/ 2>/dev/null || true
          cp -r /tmp/android-runner smoke-results/emulator-crash 2>/dev/null || true
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-api-${{ matrix.api-level }}-${{ matrix.target }}
          path: smoke-results/
          if-no-files-found: ignore

  ios:
    name: iOS build (no codesign)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  release:
    name: Publish APK
    needs: [build-apk, emulator]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blend-burst-apk
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" blend-burst.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Blend Burst build ${{ github.run_number }}" \
            --latest \
            --notes "Android test build from ${{ github.sha }}. Passed unit, widget, bot, release-APK smoke (monkey) and on-device integration tests on API 29 and 35 emulators.

          Install: download blend-burst.apk on your phone and open it (allow installs from your browser if asked)."
