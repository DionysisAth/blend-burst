name: Google Play release

# Builds the Play Store bundle (real ads) and publishes it.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   PLAY_UPLOAD_KEYSTORE_BASE64  the upload keystore, base64-encoded
#   PLAY_UPLOAD_PASSWORD         its password (store and key)
#   PLAY_SERVICE_ACCOUNT_JSON    the Google Play service account key (JSON)
# Without them the bundle is built unsigned and attached to a GitHub
# release, to be signed and uploaded by hand.

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Track: internal, alpha (closed), beta (open) or production'
        default: internal
      status:
        description: 'completed (roll out) or draft (finish in the Play Console)'
        default: completed
      notes:
        description: 'What is new (shown on Google Play)'
        default: 'Bug fixes and improvements.'

permissions:
  contents: write

concurrency:
  group: play-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  bundle:
    name: Build and publish the Play bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Version code (minutes since 1970, always increasing)
        run: echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "BB_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No upload key secret: building an unsigned bundle."
            echo "BB_UNSIGNED=1" >> "$GITHUB_ENV"
          fi
      - name: Build the bundle (real ads)
        env:
          BB_UPLOAD_PASSWORD: ${{ secrets.PLAY_UPLOAD_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-number "$VERSION_CODE" \
            --dart-define=REAL_ADS=true
          cp build/app/outputs/bundle/release/app-release.aab blend-burst.aab
      - uses: actions/upload-artifact@v4
        with:
          name: blend-burst-aab
          path: blend-burst.aab
          if-no-files-found: error
      - name: Publish to Google Play
        if: env.BB_UPLOAD_KEYSTORE != ''
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track }}
          STATUS: ${{ inputs.status }}
          NOTES: ${{ inputs.notes }}
        run: |
          pip install --quiet pyjwt cryptography
          python3 tool/play/publish.py blend-burst.aab \
            --track "$TRACK" --status "$STATUS" --notes "$NOTES"
      - name: Attach the unsigned bundle to a GitHub release
        if: env.BB_UNSIGNED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "play-$VERSION_CODE" blend-burst.aab \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Play bundle $VERSION_CODE (unsigned)" \
            --prerelease \
            --notes "Unsigned Google Play bundle (version code $VERSION_CODE) from ${{ github.sha }}, with real ads. Sign it with the upload key before uploading."
